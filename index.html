<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060919">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Yeimy Alexandra</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500;1,700&family=Jost:wght@300;400&family=Pinyon+Script&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles.css">
</head>

<body>

<canvas id="sky"></canvas>
<div class="aurora"></div>
<div class="moon"></div>
<div class="horizon-glow"></div>
<svg class="mountains" id="mountains" viewBox="0 0 1440 300" preserveAspectRatio="none" aria-hidden="true"></svg>
<div class="grain"></div>
<div class="vignette"></div>

<div class="stage" id="stage">
  <header class="hero" id="hero">
    <p class="kicker">I love you</p>

    <div class="emblem">
      <div class="halo"></div>
      <div class="orb"></div>
      <svg class="ring" viewBox="-200 -200 400 400" aria-hidden="true" fill="none" stroke="#ecd9a8">
        <circle r="196" stroke-opacity=".24" stroke-width=".6"/>
        <circle r="186" stroke-opacity=".5" stroke-width="3" stroke-dasharray=".6 11.6"/>
        <circle r="174" stroke-opacity=".14" stroke-width=".5" stroke-dasharray="2 5"/>
        <g fill="#ecd9a8" stroke="none" fill-opacity=".85">
          <path d="M0-206 L3.2 -198 L0 -190 L-3.2 -198Z"/><path d="M0 206 L3.2 198 L0 190 L-3.2 198Z"/>
          <path d="M206 0 L198 3.2 L190 0 L198 -3.2Z"/><path d="M-206 0 L-198 3.2 L-190 0 L-198 -3.2Z"/>
        </g>
      </svg>
      <svg class="ring rev" viewBox="-200 -200 400 400" aria-hidden="true" fill="none" stroke="#e8b4b8">
        <circle r="196" stroke-opacity=".26" stroke-width=".7"/>
        <circle r="186" stroke-opacity=".36" stroke-width="2.4" stroke-dasharray=".5 9"/>
        <g fill="#ecd9a8" stroke="none" fill-opacity=".8"><circle cy="-196" r="2.8"/><circle cx="169.7" cy="98" r="2.8"/><circle cx="-169.7" cy="98" r="2.8"/></g>
      </svg>
      <div class="portrait"><img src="img/retrato.webp" alt="Retrato de Yeimy Alexandra" draggable="false"></div>
      <span class="glint" style="left:6%;top:16%;--s:12px;--d:.4s"></span>
      <span class="glint" style="left:90%;top:28%;--s:16px;--d:1.6s"></span>
      <span class="glint" style="left:12%;top:68%;--s:10px;--d:2.5s"></span>
      <span class="glint" style="left:88%;top:74%;--s:13px;--d:.9s"></span>
      <span class="glint" style="left:48%;top:1%;--s:14px;--d:3.1s"></span>
      <span class="glint" style="left:72%;top:5%;--s:9px;--d:2s"></span>
      <h1 class="name" aria-label="Yeimy Alexandra"><span class="shade" aria-hidden="true">Yeimy Alexandra</span><span class="glow" aria-hidden="true">Yeimy Alexandra</span><span class="gold">Yeimy Alexandra</span></h1>
    </div>

    <svg class="flourish" viewBox="-160 -14 320 28" aria-hidden="true">
      <defs>
        <linearGradient id="fl" x1="0" x2="1"><stop offset="0" stop-color="#ecd9a8" stop-opacity="0"/><stop offset="1" stop-color="#ecd9a8" stop-opacity=".85"/></linearGradient>
        <linearGradient id="fr" x1="1" x2="0"><stop offset="0" stop-color="#ecd9a8" stop-opacity="0"/><stop offset="1" stop-color="#ecd9a8" stop-opacity=".85"/></linearGradient>
      </defs>
      <path d="M-150 0 H-34 C-26 0 -24 -7 -17 -7 C-11 -7 -11 0 -17 0" fill="none" stroke="url(#fl)" stroke-width="1"/>
      <path d="M150 0 H34 C26 0 24 -7 17 -7 C11 -7 11 0 17 0" fill="none" stroke="url(#fr)" stroke-width="1"/>
      <path d="M0 -10 C1 -3 3 -1 10 0 C3 1 1 3 0 10 C-1 3 -3 1 -10 0 C-3 -1 -1 -3 0 -10Z" fill="#ecd9a8"/>
      <circle cx="-40" cy="0" r="1.5" fill="#ecd9a8" fill-opacity=".8"/><circle cx="40" cy="0" r="1.5" fill="#ecd9a8" fill-opacity=".8"/>
    </svg>

    <p class="subtitle">Hay personas que hacen el mundo más bonito</p>
  </header>

  <section class="verse-card" id="verse-area" aria-label="Versículo bíblico">
        <span class="sheen"></span>
    <span class="vspark" style="left:7%;top:44%;--d:0s;animation-delay:.2s"></span>
    <span class="vspark" style="right:6%;top:30%;width:5px;animation-delay:1.6s"></span>
    <span class="vspark" style="left:15%;bottom:16%;width:5px;animation-delay:2.8s"></span>
    <span class="vspark" style="right:14%;bottom:30%;animation-delay:3.7s"></span>
    <svg class="verse-ornament-b" viewBox="-60 -7 120 14" aria-hidden="true">
      <path d="M-56 0 H-12" stroke="#ecd9a8" stroke-opacity=".6" stroke-width=".8"/>
      <path d="M56 0 H12" stroke="#ecd9a8" stroke-opacity=".6" stroke-width=".8"/>
      <path d="M0 -6 C.7 -2 2 -.7 6 0 C2 .7 .7 2 0 6 C-.7 2 -2 .7 -6 0 C-2 -.7 -.7 -2 0 -6Z" fill="#ecd9a8"/>
      <circle cx="-22" r="1.3" fill="#e8b4b8"/><circle cx="22" r="1.3" fill="#e8b4b8"/>
    </svg>
    <span class="corner tl"></span><span class="corner tr"></span>
    <span class="corner bl"></span><span class="corner br"></span>
    <svg class="verse-ornament" viewBox="-60 -7 120 14" aria-hidden="true">
      <path d="M-56 0 H-12" stroke="#ecd9a8" stroke-opacity=".6" stroke-width=".8"/>
      <path d="M56 0 H12" stroke="#ecd9a8" stroke-opacity=".6" stroke-width=".8"/>
      <path d="M0 -6 C.7 -2 2 -.7 6 0 C2 .7 .7 2 0 6 C-.7 2 -2 .7 -6 0 C-2 -.7 -.7 -2 0 -6Z" fill="#ecd9a8"/>
      <circle cx="-22" r="1.3" fill="#e8b4b8"/><circle cx="22" r="1.3" fill="#e8b4b8"/>
    </svg>
    <p class="verse-text" id="verse-text" aria-live="polite"></p>
    <p class="verse-ref" id="verse-reference"></p>
    <p class="hint">Toca la pantalla para descubrir otro versículo</p>
    <div class="progress"><i id="progress"></i></div>
  </section>
</div>

<script src="script.js"></script>

</body>
</html>
